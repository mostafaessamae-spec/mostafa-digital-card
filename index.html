<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b20">
<meta name="description" content="Mostafa El-Hayes — Senior Video Editor. Creative editing, motion videos, and visual storytelling.">
<title>Mostafa El-Hayes | Senior Video Editor</title>
<style>
:root{--navy:#050b20;--navy2:#071a45;--blue:#0878ff;--blue2:#1769e8;--gold:#f4c64e;--white:#f7f8fc;--muted:#e0e6f3}
*{box-sizing:border-box}
html{min-height:100%;background:var(--navy)}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:0;color:var(--white);font-family:Inter,Arial,sans-serif;background:radial-gradient(ellipse at 50% 20%,#102d70 0%,#07183f 37%,#03091b 78%)}
.card{width:min(100%,480px);min-height:100svh;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;text-align:center;padding:28px 24px 32px;position:relative;overflow:visible;margin:0 auto}
.portrait-wrap{width:clamp(190px,48vw,250px);height:clamp(190px,48vw,250px);aspect-ratio:1/1;border-radius:50%;padding:7px;border:6px solid var(--gold);box-shadow:0 0 0 4px var(--blue),0 0 38px #1769e888;margin:0 auto 26px;position:relative;flex:0 0 auto;overflow:hidden}
.portrait-wrap:before{content:"";position:absolute;inset:5px;border:3px solid var(--blue);border-radius:50%;pointer-events:none;z-index:2}
.portrait{display:block;width:100%;height:100%;min-width:0;min-height:0;object-fit:cover;object-position:center 24%;border-radius:50%;background:#10265b}
h1{font-size:clamp(31px,7.5vw,43px);line-height:1.08;letter-spacing:-1px;margin:0 0 12px;font-weight:750}
.role{font-size:clamp(21px,5vw,27px);line-height:1.2;color:var(--gold);font-weight:700;margin:0 0 20px;display:flex;align-items:center;justify-content:center;gap:16px;white-space:nowrap}
.role:before,.role:after{content:"";height:2px;width:clamp(34px,15vw,76px);background:linear-gradient(90deg,transparent,var(--gold))}.role:after{transform:scaleX(-1)}
.eyebrow{display:inline-block;color:#fff;background:linear-gradient(90deg,#0759c9,#1769e8);border:2px solid var(--blue);border-radius:999px;padding:8px 22px;font-size:14px;letter-spacing:5px;font-weight:700;margin:0 0 26px}
.bio{max-width:410px;color:var(--muted);font-size:clamp(16px,4.1vw,19px);line-height:1.55;margin:0 auto 38px}
.actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 0 18px}
a.btn{min-height:62px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:14px;text-decoration:none;color:var(--white);font-size:clamp(15px,4vw,18px);font-weight:700;border:3px solid var(--blue);background:linear-gradient(120deg,#06183e,#07112b);box-shadow:inset 0 0 20px #0c347466;transition:transform .2s,filter .2s}
a.btn:hover,.links a:hover{transform:translateY(-3px);filter:brightness(1.15)}
.actions .btn svg{width:36px;height:36px;flex:none}
.save-contact{width:100%;min-height:70px;margin:0 0 28px;border:3px solid var(--gold)!important;background:linear-gradient(120deg,#0a1e4a,#07132f)!important;box-shadow:0 0 20px #f4c64e22,inset 0 0 20px #0c347466}
.save-contact svg{width:34px;height:34px}
.links{width:100%;display:flex;justify-content:center;align-items:center;gap:clamp(12px,4vw,22px);flex-wrap:nowrap;margin:0 auto 36px}
.links a{width:clamp(58px,14vw,72px);height:clamp(58px,14vw,72px);border:3px solid var(--blue);border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#071a45,#040d24);color:#fff;text-decoration:none;box-shadow:0 0 16px #0878ff22;transition:transform .2s,filter .2s;flex:none}
.links svg{width:65%;height:65%;display:block}
.footer{width:100%;display:flex;align-items:center;justify-content:center;gap:14px;color:#f4f5fa;font-size:clamp(10px,2.7vw,13px);letter-spacing:clamp(2px,1vw,4px);white-space:nowrap;margin-top:auto;padding-top:8px;position:relative;z-index:2}
.footer:before,.footer:after{content:"";height:2px;flex:1;max-width:60px;background:linear-gradient(90deg,transparent,var(--gold))}.footer:after{transform:scaleX(-1)}
.bottom-wave{position:absolute;left:-10%;right:-10%;bottom:-88px;height:88px;border-top:3px solid var(--blue);border-radius:50% 50% 0 0/30% 30% 0 0;transform:rotate(4deg);pointer-events:none;opacity:.85;z-index:0}
.bottom-wave:after{content:"";position:absolute;left:40%;right:-5%;top:8px;height:72px;border-top:4px solid var(--gold);border-radius:50% 50% 0 0/30% 30% 0 0;transform:rotate(-4deg)}
@media(max-width:390px){.card{padding:22px 12px 24px}.portrait-wrap{width:190px;height:190px;margin-bottom:25px}.bio{margin-bottom:28px}.actions{gap:9px}.actions a.btn{gap:8px;min-height:58px;font-size:14px}.actions .btn svg{width:30px;height:30px}.save-contact{min-height:64px}.links{gap:10px;margin-bottom:28px}.links a{width:54px;height:54px}}
@media(min-height:900px){.card{padding-top:42px;padding-bottom:38px}.portrait-wrap{width:250px;height:250px;margin-bottom:32px}.bio{margin-bottom:42px}}
</style>
</head>
